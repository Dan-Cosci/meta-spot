
services:
  api:
    build: ./backend
    container_name: api-cnt
    ports:
      - "8080:8080"
    env_file: ./backend/.env.local

    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: frnt-cnt
    ports:
      - "5173:80"
    env_file: ./frontend/.env.local


    volumes:
      - ./frontend:/app
